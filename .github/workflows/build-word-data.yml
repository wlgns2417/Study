name: Build conversational word data

on:
  workflow_dispatch:
  push:
    paths:
      - "collect_words.py"
      - ".github/workflows/build-word-data.yml"

permissions:
  contents: write

jobs:
  build-words:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Build conversation_words.csv
        run: python collect_words.py

      - name: Commit generated data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add conversation_words.csv
          if git diff --cached --quiet; then
            echo "No word-data changes."
          else
            git commit -m "Generate corpus-based conversational word data"
            git push
          fi
